name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        env:
          ENVIRONMENT: test
          JWT_SECRET: test-secret
          DATABASE_URL: sqlite+aiosqlite:///./test.db
        run: |
          set -o pipefail
          python -m pytest tests/ -q | tee pytest-output.txt
      - name: Update test badge artifact
        run: |
          mkdir -p docs/badges
          COUNT=$(grep -oE "[0-9]+ passed" backend/pytest-output.txt | tail -1 | grep -oE "[0-9]+" || echo "0")
          echo "{\"schemaVersion\":1,\"label\":\"tests\",\"message\":\"${COUNT} passing\",\"color\":\"brightgreen\"}" > docs/badges/tests.json
      - name: Upload test badge artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-badge-${{ github.sha }}
          path: docs/badges/tests.json
          retention-days: 30
      - name: Export OpenAPI spec
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ninai_test
          JWT_SECRET: test-secret
          ENVIRONMENT: test
        run: |
          python -c "
          import json
          from app.main import app
          spec = app.openapi()
          with open('openapi.json', 'w', encoding='utf-8') as f:
              json.dump(spec, f, indent=2)
          print(f'OpenAPI spec: {len(spec[\"paths\"])} paths exported')
          "
      - name: Upload OpenAPI spec
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec-${{ github.sha }}
          path: backend/openapi.json
          retention-days: 90

  test-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SDK dependencies
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run SDK tests (v1 + v2 engine_version)
        working-directory: sdk/python
        run: python -m pytest tests/ -q
