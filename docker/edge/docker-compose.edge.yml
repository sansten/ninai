version: "3.9"

services:
  ninai-api:
    image: ghcr.io/sansten/ninai:latest
    container_name: ninai-edge-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.edge
    environment:
      - DATABASE_URL=postgresql+asyncpg://ninai:ninai@postgres:5432/ninai
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://ollama:11434
      - AGENT_STRATEGY=llm
      - DEPLOYMENT_MODE=edge
      - LOCAL_FIRST_MODE=true
      - ORG_FEDERATED_LOGIN_ENABLED=false
    depends_on:
      - postgres
      - redis
      - qdrant
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ninai-edge-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ninai-edge-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ninai-edge-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=ninai
      - POSTGRES_PASSWORD=ninai
      - POSTGRES_DB=ninai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ninai-edge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  ollama_data:
  qdrant_data:
  postgres_data:
  redis_data:
