version: "3.9"

services:
  ninai-api:
    image: ghcr.io/sansten/ninai:latest
    container_name: ninai-edge-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.edge
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=ninai
      - POSTGRES_PASSWORD=ninai
      - POSTGRES_DB=ninai
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
      - DB_POOL_TIMEOUT_SECONDS=${DB_POOL_TIMEOUT_SECONDS:-30}
      - DB_POOL_RECYCLE_SECONDS=${DB_POOL_RECYCLE_SECONDS:-1800}
      - DB_POOL_USE_LIFO=${DB_POOL_USE_LIFO:-true}
      - REDIS_URL=redis://redis:6379/0
      - GRAPH_REDIS_URL=redis://falkordb:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_TIMEOUT_SECONDS=${QDRANT_TIMEOUT_SECONDS:-2.5}
      - VLLM_BASE_URL=http://vllm:11434
      - VLLM_MODEL=${VLLM_MODEL:-qwen2.5:7b}
      - AGENT_STRATEGY=${AGENT_STRATEGY:-llm}
      - DEPLOYMENT_MODE=edge
      - LOCAL_FIRST_MODE=true
      - ORG_FEDERATED_LOGIN_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      qdrant:
        condition: service_started
      vllm:
        condition: service_started

  vllm:
    image: vllm/vllm:latest
    container_name: ninai-edge-vllm
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - vllm_data:/root/.vllm

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ninai-edge-qdrant
    restart: unless-stopped
    command: ["./qdrant", "--config-path", "/qdrant/config/config.yaml"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
      - ./qdrant/config.yaml:/qdrant/config/config.yaml:ro

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ninai-edge-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=ninai
      - POSTGRES_PASSWORD=ninai
      - POSTGRES_DB=ninai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ninai -d ninai"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ninai-edge-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  falkordb:
    image: falkordb/falkordb:latest
    container_name: ninai-edge-falkordb
    restart: unless-stopped
    command: ["redis-server", "/etc/falkordb/falkordb.conf"]
    ports:
      - "6380:6379"
    volumes:
      - falkordb_data:/data
      - ./falkordb/falkordb.conf:/etc/falkordb/falkordb.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  vllm_data:
  qdrant_data:
  postgres_data:
  redis_data:
  falkordb_data:
