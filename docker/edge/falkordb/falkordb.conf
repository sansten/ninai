bind 0.0.0.0
protected-mode no
port 6379
timeout 0
tcp-keepalive 300
loadmodule /usr/lib/redis/modules/graphblas.so

# Keep graph data durable for local-first restarts.
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# Graph workloads are memory-sensitive: reserve more memory.
maxmemory 1024mb
maxmemory-policy noeviction

databases 16
