# vLLM Docker Compose Service
vllm:
  image: vllm/vllm:latest
  container_name: vllm
  ports:
    - "11434:11434"
  volumes:
    - vllm_data:/root/.vllm
  environment:
    - VLLM_MODELS=qwen2.5:0.5b
    # You can change to another model, e.g. mistral, phi3, or mixtral if preferred
  restart: unless-stopped

volumes:
  vllm_data:
