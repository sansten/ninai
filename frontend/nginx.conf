server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all API requests to the backend FastAPI service
    location /api/ {
        proxy_pass http://ninai-enterprise:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
    }

    # Serve static assets with long-lived cache
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — every non-file path serves index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint used by GKE readiness/liveness probes
    location /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
