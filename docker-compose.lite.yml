version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: ninai-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=ninai
      - POSTGRES_PASSWORD=ninai_dev_password
      - POSTGRES_DB=ninai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ninai -d ninai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ninai-network

  redis:
    image: falkordb/falkordb:latest
    container_name: ninai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --loadmodule /usr/lib/redis/modules/graphblas.so --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ninai-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ninai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ninai-network

  ocr:
    build:
      context: ./docker/ocr
      dockerfile: Dockerfile
    container_name: ninai-ocr
    ports:
      - "8010:8000"
    environment:
      - TESSERACT_LANG=eng
      - TESSERACT_PSM=3
    networks:
      - ninai-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ninai-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend_attachments:/data/memory_attachments
      - backend_backups:/backups
    environment:
      - APP_ENV=development
      - DEBUG=true
      - AGENT_STRATEGY=heuristic
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=ninai
      - POSTGRES_PASSWORD=ninai_dev_password
      - POSTGRES_DB=ninai
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - MEMORY_ATTACHMENTS_DIR=/data/memory_attachments
      - OCR_SERVICE_URL=http://ocr:8000
      - OCR_SERVICE_TIMEOUT_SECONDS=5
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5:7b
      - OLLAMA_MODEL_FAST=qwen2.5:0.5b
      - OLLAMA_MODEL_PLANNING=qwen2.5:7b
      - OLLAMA_MODEL_DISTILLATION=qwen2.5:7b
      - OLLAMA_MODEL_BOUNDARY=qwen2.5:0.5b
      - OLLAMA_MODEL_UNCERTAINTY=qwen2.5:0.5b
      - OLLAMA_MODEL_AGENTS=qwen2.5:7b
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      ocr:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; urllib.request.urlopen('http://localhost:8000/health'); sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ninai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ninai-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=/api/v1
      - VITE_API_PROXY_TARGET=http://backend:8000
      - VITE_DEV_PORT=3000
      - VITE_HMR_HOST=localhost
      - VITE_HMR_PORT=3000
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=250
    depends_on:
      - backend
    networks:
      - ninai-network

networks:
  ninai-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  frontend_node_modules:
  backend_backups:
