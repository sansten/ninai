[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ninai"
version = "1.1.0a1"
description = "Python SDK for Ninai Cognitive OS"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Ninai Team", email = "support@sansten.com"}
]
keywords = ["ninai", "ai", "memory", "agentic", "sdk", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.0.280",
    "mypy>=1.0.0",
]





[tool.setuptools.packages.find]
where = ["."]
include = ["ninai*"]

[tool.setuptools]
package-data = {ninai = ["py.typed"]}

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = true

[project.urls]
Homepage = "https://sansten.com/ninai"
Documentation = "https://sansten.com/ninai/docs"
Repository = "https://github.com/sansten/ninai"
Issues = "https://github.com/sansten/ninai/issues"
Changelog = "https://github.com/sansten/ninai/blob/main/sdk/python/CHANGELOG.md"


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
