[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ninai-cli"
version = "0.1.0"
description = "Ninai Cognitive OS CLI"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.0",
  "httpx>=0.26.0",
  "websockets>=12.0",
]

[project.scripts]
ninai = "ninai.main:app"

[tool.setuptools.packages.find]
where = ["."]
